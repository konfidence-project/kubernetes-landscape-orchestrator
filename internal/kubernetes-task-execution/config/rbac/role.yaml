---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs/status
  verbs:
  - get
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - taskexecutions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - taskexecutions/finalizers
  verbs:
  - update
- apiGroups:
  - landscape.konfidence.cloud
  resources:
  - taskexecutions/status
  verbs:
  - get
  - patch
  - update
