---

# Step 1: Create a dedicated Service Account for Flux in the remote cluster.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: konfidence-deployer
  namespace: kube-system

---

# Step 2: Bind permissions; Flux needs to create / update / delete resources, so typically it gets cluster-admin in the
# target cluster (you can scope this down later if needed):

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: konfidence-deployer-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: konfidence-deployer
    namespace: kube-system

---

# Step 3: Get the Service Account token. For Kubernetes v1.24+, ServiceAccounts no longer automatically create secrets.
# So you need to create a token manually:

apiVersion: v1
kind: Secret
metadata:
  name: konfidence-deployer-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: konfidence-deployer
type: kubernetes.io/service-account-token
# token will be in .data.token field after creation
