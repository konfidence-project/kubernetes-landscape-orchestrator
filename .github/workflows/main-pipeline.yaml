name: Main

on:
  push:
    branches:
      - main

jobs:
  lint-test-build:
    name: Main
    # Skip when the release PR with a chart version bump is merged into main — the
    # chained jobs in release-please-pipeline.yaml handle building and publishing
    # for those commits.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/lint-test-build.yaml
    secrets: inherit
    with:
      mode: main
      snapshot-tag: ${{ github.sha }}

  publish-dev-chart:
    name: Publish Dev Helm Chart
    needs: [lint-test-build]
    permissions:
      contents: read
      packages: write
    uses: konfidence-project/.github/.github/workflows/publish-helm-charts.yaml@v4
    with:
      mode: dev
      charts: charts/kubernetes-landscape-orchestrator
