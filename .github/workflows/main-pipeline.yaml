name: Main

on:
  push:
    branches:
      - main

jobs:
  lint-test-build:
    name: Main
    # Skip when the release PR with a chart version bump is merged into main — the
    # chained jobs in release-please-pipeline.yaml handle building and publishing
    # for those commits.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: konfidence-project/kubernetes-landscape-orchestrator/.github/workflows/lint-test-build.yaml@main
    secrets: inherit
    with:
      mode: main
      snapshot-tag: ${{ github.sha }}
