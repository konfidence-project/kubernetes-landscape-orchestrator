name: Lint, Test and Build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
    with:
      codegen-cmd: fmt vet
  reuse-lint:
    name: REUSE
    uses: konfidence-project/.github/.github/workflows/reuse-lint.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
  test:
    name: Test
    uses: konfidence-project/.github/.github/workflows/test.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
    with:
      test-cmd: test
  build:
    name: Build / Orchestrator
    needs: [lint, reuse-lint, test]
    uses: konfidence-project/.github/.github/workflows/goreleaser-pr.yaml@ef25064d200c2da0789c100878a4ee29a147518d # v5.0.0
