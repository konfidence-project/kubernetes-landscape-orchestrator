name: Lint, Test and Build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # hardened workflows
    with:
      codegen-cmd: fmt vet
  reuse-lint:
    name: REUSE
    uses: konfidence-project/.github/.github/workflows/reuse-lint.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # hardened workflows
  test:
    name: Test
    uses: konfidence-project/.github/.github/workflows/test.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # hardened workflows
    with:
      test-cmd: test
  build:
    name: Build / Orchestrator
    needs: [lint, reuse-lint, test]
    uses: konfidence-project/.github/.github/workflows/goreleaser-pr.yaml@2de51ca6a1295e02bbceaf3c88bdba21b4cc0169 # read-only build
