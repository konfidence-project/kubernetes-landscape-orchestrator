name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test
    uses: konfidence-project/.github/.github/workflows/controller-test.yaml@v4
    secrets: inherit
    with:
      test-cmd: test

  lint:
    name: Lint
    uses: konfidence-project/.github/.github/workflows/golang-lint.yaml@v4
    secrets: inherit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Setup GitHub Repo Access
        uses: konfidence-project/.github/.github/actions/github-repo-access@v4
        with:
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ env.GH_TOKEN }}

      - name: Init Hermit
        uses: cashapp/activate-hermit@v1

      - name: Set GOPRIVATE
        run: echo "GOPRIVATE=github.com/konfidence-project" >> "$GITHUB_ENV"

      - name: Verify generated test CRDs
        run: make verify-generated-test-crds

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Bake (build only)
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          push: false
          set: |
            *.secrets=id=gh_token,env=GH_TOKEN
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
      - build
    if: always()
    steps:
      - name: Fail if any job failed or cancelled
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          CI_FAILED=$(echo "$NEEDS_JSON" | jq -r '
          to_entries[]
          | select(.value.result == "failure" or .value.result == "cancelled")
          | .key
          ')

          if [ -n "$CI_FAILED" ]; then
            echo "Failed jobs:"
            echo "$CI_FAILED"
            exit 1
          fi

          echo "All required jobs passed or were skipped"
