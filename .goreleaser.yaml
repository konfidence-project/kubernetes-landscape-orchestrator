version: 2

project_name: kubernetes-landscape-orchestrator

retry:
  # Set max retry count.
  # Setting to 1 disables retries (single attempt).
  #
  # Default: 10
  attempts: 5

  # Set delay between retry
  #
  # Default: 10s
  delay: 10s

  # Default: 5m
  max_delay: 3m

snapshot:
  version_template: '{{ .Env.GORELEASER_CURRENT_TAG }}'

before:
  hooks:
    - go mod tidy

builds:
  - id: kubernetes-landscape-orchestrator
    binary: kubernetes-landscape-orchestrator
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X github.com/konfidence-project/kubernetes-landscape-orchestrator/pkg/build.Version={{.Version}} -X github.com/konfidence-project/kubernetes-landscape-orchestrator/pkg/build.GitCommit={{.Commit}}

  - id: vector-data-service
    binary: vector-data-service
    main: ./cmd/vectordata
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - id: kubernetes-landscape-orchestrator
    ids: [kubernetes-landscape-orchestrator]
    formats: [none]
  - id: vector-data-service
    ids: [vector-data-service]
    formats: [none]

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: kubernetes-landscape-orchestrator
    ids: [kubernetes-landscape-orchestrator]
    dockerfile: Dockerfile
    images:
      - ghcr.io/konfidence-project/kubernetes-landscape-orchestrator
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      OPERATOR_NAME: kubernetes-landscape-orchestrator

  - id: vector-data-service
    ids: [vector-data-service]
    dockerfile: Dockerfile
    images:
      - ghcr.io/konfidence-project/vector-data-service
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      OPERATOR_NAME: vector-data-service

changelog:
  use: github-native

release:
  # goreleaser must not publish the release itself — the pipeline undrafts it
  # after the Helm charts are published, so a failed run never leaves a
  # half-published release
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  # release-please owns the release body (CHANGELOG); goreleaser only attaches artifacts
  mode: keep-existing
  prerelease: auto
