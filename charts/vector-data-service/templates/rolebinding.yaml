apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vector-data-service.fullname" . }}
  namespace: {{ include "vector-data-service.watchNamespace" . }}
  labels:
    {{- include "vector-data-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vector-data-service.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vector-data-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
